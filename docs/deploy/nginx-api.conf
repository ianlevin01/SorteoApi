# Nginx reverse proxy para la API de Sorteo.
#
# 1. Reemplazá  api.TU-DOMINIO.com  por tu dominio de la API.
# 2. Copialo a  /etc/nginx/sites-available/sorteo-api
# 3. sudo ln -s /etc/nginx/sites-available/sorteo-api /etc/nginx/sites-enabled/
# 4. sudo nginx -t && sudo systemctl reload nginx
# 5. sudo certbot --nginx -d api.TU-DOMINIO.com   (agrega el bloque HTTPS solo)

server {
    listen 80;
    listen [::]:80;
    server_name api.TU-DOMINIO.com;

    # Los comprobantes pueden pesar hasta ~8 MB (multer). Nginx por defecto corta en 1 MB.
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La verificación del comprobante puede tardar unos segundos.
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
